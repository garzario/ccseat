name: Feature request
description: Suggest an idea for ccseat
title: "[Idea] "
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Only the first box is required, and a sentence or two is plenty.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should ccseat do? A command, some output or a setting you have in mind is welcome.
      placeholder: |
        A way to hide a seat from the picker without removing it, for an account
        I only use now and then.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Optional. What is hard or slow today, and what you do instead.
    validations:
      required: false
